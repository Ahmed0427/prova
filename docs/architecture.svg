<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 744" role="img" aria-label="SP1 runs the contract's own RISC-V code, with no EVM interpreter" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">
  <!-- Same drawing as the Architecture diagram in the project doc. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a3a29b"/>
    </marker>
  </defs>
  <rect width="760" height="744" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">SP1 runs the contract's own RISC-V code, with no EVM interpreter</text>

  <g fill="none" stroke="#a3a29b" stroke-width="1.25" marker-end="url(#arrow)">
    <path d="M232 100H276"/>
    <path d="M484 100H528"/>
    <path d="M632 136V184"/>
    <path d="M528 220H484"/>
    <path d="M276 220H232"/>
    <path d="M128 256V304"/>
    <path d="M380 256V304"/>
    <path d="M328 380H448"/>
    <path d="M448 424H328"/>
    <path d="M380 472V512"/>
    <path d="M480 600V648"/>
    <path d="M344 684H416"/>
  </g>

  <g fill="none" stroke="#a3a29b" stroke-width="1.25">
    <rect x="24" y="64" width="208" height="72" rx="8"/>
    <rect x="276" y="64" width="208" height="72" rx="8"/>
    <rect x="528" y="64" width="208" height="72" rx="8"/>
    <rect x="528" y="184" width="208" height="72" rx="8"/>
    <rect x="276" y="184" width="208" height="72" rx="8"/>
    <rect x="24" y="184" width="208" height="72" rx="8"/>
    <rect x="24" y="304" width="712" height="168" rx="8"/>
    <rect x="48" y="352" width="280" height="96" rx="8"/>
    <rect x="196" y="512" width="368" height="88" rx="8"/>
    <rect x="24" y="648" width="320" height="72" rx="8"/>
    <rect x="416" y="648" width="320" height="72" rx="8"/>
  </g>
  <rect x="448" y="352" width="264" height="96" rx="8" fill="#2f6fd0" fill-opacity="0.12" stroke="#2f6fd0" stroke-width="2"/>

  <g font-size="13" font-weight="600" fill="#1f1e1d">
    <text x="36" y="88">Contract source</text>
    <text x="288" y="88">Solang (sp1-target)</text>
    <text x="540" y="88">./prova compile</text>
    <text x="540" y="208">guest/build.rs</text>
    <text x="288" y="208">Guest ELF</text>
    <text x="36" y="208">prova host</text>
    <text x="40" y="330">SP1 zkVM: execute, or prove with --prove</text>
    <text x="60" y="376">Guest runtime (Rust)</text>
    <text x="460" y="376">Contract code (Solang)</text>
    <text x="208" y="536">Public values</text>
    <text x="36" y="672">Benchmark baseline</text>
    <text x="428" y="672">./prova bench</text>
  </g>

  <g fill="#5e5d59">
    <text x="36" y="104">contracts/erc20.sol</text>
    <text x="36" y="120">plain Solidity</text>
    <text x="288" y="104">compiles with --target riscv</text>
    <text x="288" y="120">emits an RV64IM object file</text>
    <text x="540" y="104">renames the entry points</text>
    <text x="540" y="120">build/contracts/erc20.o</text>
    <text x="540" y="224">links every listed object</text>
    <text x="540" y="240">generates the CODES table</text>
    <text x="288" y="224">sp1-zkvm + guest runtime</text>
    <text x="288" y="240">+ the linked contract code</text>
    <text x="36" y="224">embeds the ELF, parses steps</text>
    <text x="36" y="240">passes state to next step</text>
    <text x="136" y="286">Input: context, calldata, state</text>
    <text x="388" y="286">loaded into SP1</text>
    <text x="60" y="392">reads Input, opens call frames</text>
    <text x="60" y="408">storage map and write journal</text>
    <text x="60" y="424">commits the public values</text>
    <text x="388" y="372" text-anchor="middle">calls entry point</text>
    <text x="388" y="442" text-anchor="middle">__sys_* imports</text>
    <text x="388" y="496">commit</text>
    <text x="208" y="552">context, calldata, state_before, reverted,</text>
    <text x="208" y="568">output, events, state_after</text>
    <text x="208" y="584">with --prove: an SP1 proof over these bytes</text>
    <text x="488" y="628">native result</text>
    <text x="36" y="688">solc --optimize bytecode</text>
    <text x="36" y="704">run by revm in evm-guest (SP1)</text>
    <text x="380" y="676" text-anchor="middle">revm result</text>
    <text x="428" y="688">requires the same Public from both</text>
    <text x="428" y="704">prints cycles: setup, execute, commit</text>
  </g>
  <g fill="#1f1e1d">
    <text x="460" y="392">dispatcher picks the function</text>
    <text x="460" y="408">runs as native RISC-V</text>
    <text x="460" y="424">no EVM interpreter</text>
  </g>
</svg>
